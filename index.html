<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>NEET PG ENT PYQ Quiz</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <main class="container">
    <h1>Last 5-Year NEET PG ENT PYQ Quiz</h1>
    <p class="subtitle">20 questions extracted from PrepLadder's ENT PYQ page.</p>

    <form id="quiz-form"></form>

    <div class="actions">
      <button id="submit-btn" type="button">Submit Answers</button>
      <button id="reset-btn" type="button" class="secondary">Reset</button>
    </div>

    <section id="result" class="result hidden" aria-live="polite"></section>
  </main>

  <script src="script.js"></script>
</body>
</html>
